services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME lipsește din .env}
      POSTGRES_USER: ${DB_USER:?DB_USER lipsește din .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD lipsește din .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      - db

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8093:80"

volumes:
  db-data:
